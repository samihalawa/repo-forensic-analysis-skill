interface:
  display_name: "Repo Forensics"
  short_description: "Run a zero-assumption forensic analysis of repo history, conversation history, and current repo truth"
  default_prompt: "Use $repo-forensic-analysis-skill when the user wants a full repo forensic analysis, historical verification, anomaly detection, or a primary-source reconstruction of what actually happened in a codebase. Start with an evidence ledger before any conclusions: inventory recent git history, churn, authors, merge and revert commits, Codex and Claude conversation files tied to the repo, repo-local conversation exports, and key docs such as AGENTS.md, DESIGN.md, CLAUDE.md, and README.md. Do not continue until you can report exact counts for commits, conversation files, documentation files, and highest-churn files. Then analyze each commit in chronological order, classify the change type, extract files changed and line counts, and flag suspicious patterns such as vague or typo-heavy messages, repeated churn, rewrites, logic changes without tests, unexplained config changes, and near-term self-corrections. Read each conversation source sequentially, normalize the user's actual intent, compare agent promises with repo truth, and tag turns as OK, PARTIAL, FAIL, CORRECTED, or IGNORED. Build a feature evolution map across UI, business logic, data models, routes, config, styling, analytics, and copy. After the historical pass, verify the current repo directly with the fastest real checks that fit the stack, including typecheck, lint, tests, runtime inspection, and targeted code verification for claimed fixes. Group verified findings into critical, medium, and minor anomalies, plus documentation drift and agent-behavior issues. If the user expects execution mode, fix verified critical anomalies and verify each batch instead of stopping at the report. Never trust prior summaries, never skip the source inventory, and never claim completion without primary-source evidence."
